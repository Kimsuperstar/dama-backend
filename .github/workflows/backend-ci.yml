name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: dama
          MARIADB_USER: dama
          MARIADB_PASSWORD: dama1234
          MARIADB_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/dama
          SPRING_DATASOURCE_USERNAME: dama
          SPRING_DATASOURCE_PASSWORD: dama1234
          APP_FRONTEND_URL: ${{ vars.APP_FRONTEND_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao
        run: ./gradlew clean build --stacktrace --info